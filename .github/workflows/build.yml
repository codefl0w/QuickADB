name: Build QuickADB

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'V*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: QuickADB_V5.3.0_Windows_x86_64
            artifact_path: dist/QuickADB_V5.3.0_Windows_x86_64.exe
          - os: ubuntu-22.04
            artifact_name: QuickADB_V5.3.0_Linux_x86_64
            artifact_path: QuickADB_V5.3.0_Linux_x86_64.AppImage
          - os: macos-latest
            artifact_name: QuickADB_V5.3.0_macOS_arm64
            artifact_path: dist/QuickADB_V5.3.0_Darwin_arm64
          - os: macos-15-intel
            artifact_name: QuickADB_V5.3.0_macOS_x86_64
            artifact_path: dist/QuickADB_V5.3.0_Darwin_x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build executable
        run: python build.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyqt6 python3-pip python3-venv zstd file

      - name: Build executable
        run: |
          python3 -m venv --system-site-packages venv
          . venv/bin/activate
          pip install -r requirements.txt
          python build.py

      - name: Upload Linux ARM64 AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickADB_V5.3.0_Linux_arm64
          path: QuickADB_V5.3.0_Linux_arm64.AppImage
          if-no-files-found: error

  release:
    needs: [build, build-linux-arm64]
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
    runs-on: ubuntu-22.04

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
